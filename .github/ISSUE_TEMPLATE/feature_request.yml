name: "✨ Feature Request"
description: "Suggest an idea, enhancement, new logical theory, or exporter format"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an enhancement to `logic-prover`! Please provide details about your idea below.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Motivation
      description: Is your feature request related to a problem or limitation? Please describe clearly.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution / Feature
      description: Describe the solution you'd like to see and how it should work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions, workarounds, or features you've considered.
  - type: textarea
    id: context
    attributes:
      label: Additional Context & Mathematical / Logical References
      description: Add any relevant academic papers, Lean 4 / TPTP reference links, or screenshots.
