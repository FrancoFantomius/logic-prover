name: "🐛 Bug Report"
description: "File a bug report or report unexpected prover behavior"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report an issue with `logic-prover`! Please fill out the sections below to help us reproduce and fix it.
  - type: input
    id: version
    attributes:
      label: logic-prover Version
      description: What version of `logic-prover` are you using? (e.g., `0.1.4` or `main`)
      placeholder: "0.1.4"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating System & Python Environment
      description: OS and Python version (e.g., Windows 11 / Python 3.12, Ubuntu 22.04 / Python 3.11)
      placeholder: "Ubuntu 22.04, Python 3.11.8"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproducible Example
      description: Provide a minimal code snippet or CLI command that reproduces the issue.
      render: python
      placeholder: |
        from logic_prover.prover.engine import TheoremProver
        from logic_prover.core.parser import parse_formula

        # Paste minimal formula or code here
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Traceback or Error Output
      description: Paste any error traceback or console output here.
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues to verify this is not a duplicate.
          required: true
        - label: I have tested with the latest release or main branch.
          required: false
